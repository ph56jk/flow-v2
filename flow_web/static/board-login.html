<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Đăng nhập · Bảng HaviGroup</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e8590c'/%3E%3Ctext x='16' y='23' font-family='Arial' font-weight='700' font-size='20' fill='white' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
<!-- Trang đăng nhập của `python -m flow_web.board`. Máy chủ thay dòng lỗi vào chỗ đánh dấu. -->
<style>
  :root {
    --bg: #f3f4f6; --panel: #ffffff; --ink: #14161b; --muted: #697083; --line: #e3e5ea;
    --accent: #e8590c; --bad: #c62f2b; --bad-bg: #fce5e4;
    --shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 8px 24px rgba(15, 23, 42, .08);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1014; --panel: #161920; --ink: #e7e9ee; --muted: #9aa1b1; --line: #272c36;
      --accent: #ff8a3d; --bad: #ff6f69; --bad-bg: #33191a; --shadow: none; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  form { width: min(360px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; box-shadow: var(--shadow); }
  .logo { width: 44px; height: 44px; border-radius: 12px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 21px; margin-bottom: 14px; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  p { margin: 0 0 18px; color: var(--muted); }
  label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; }
  input { width: 100%; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 9px; padding: 10px 12px; font: inherit; font-size: 15px; }
  input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 40%, transparent); border-color: var(--accent); }
  button { width: 100%; margin-top: 14px; border: 0; border-radius: 9px; padding: 11px; background: var(--accent); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  button:hover { filter: brightness(1.06); }
  .err { margin: 0 0 14px; padding: 9px 12px; border-radius: 9px; background: var(--bad-bg); color: var(--bad); font-weight: 600; }
</style>
</head>
<body>
<form method="post" action="/login">
  <div class="logo">H</div>
  <h1>Bảng điều khiển HaviGroup</h1>
  <p>Đăng Etsy và tạo ảnh. Nhập mật khẩu để xem.</p>
  <!--error-->
  <label for="password">Mật khẩu</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
  <button type="submit">Vào bảng</button>
</form>
</body>
</html>
